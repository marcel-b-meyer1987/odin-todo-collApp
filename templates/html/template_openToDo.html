<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" sizes="16x16" href="../../ToDo CollApp Favicon.png">
    <title>ToDo CollApp</title>
    <link rel="stylesheet" href="../../css/style.css">
    
</head>
<body id="app-root">
    <!-- DOM will be rendered here dynamically by UI Manager -->

        <header class="app-header">
            <span class="app-logo" id="nav-home">T</span> <!-- ${APP_CONST.APP_LOGO} -->
            <button class="menu-toggle" id="menu-btn">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </button>
        </header>
        
        <!-- Dynamic Main Content -->
        <main id="app-main">

            <!-- Search & Filter -->
            <div class="search-filter-container">
                <input type="text" id="search-input" placeholder="Search & Filter">
                <button class="filter-btn">ᯤ</button> 
            </div>
            
            <!-- Display Path-->
             <div id="path-container">
                 <!-- ${pathStr} -->
                <span class="path-node root-node" data-type="root">/</span>
                <span class="path-node project-node">TÜV 08/2026</span>
                &nbsp;/&nbsp;
                <span class="path-node todo-node">THW</span>
                &nbsp;/&nbsp;
                <span class="path-node todo-node">Auflieger</span>
                &nbsp;/&nbsp;
             </div>

            <!-- Hide ToDo-List -->
            <!-- DISPLAY FORM FOR NEW TODO INSTEAD: --> 
        
        
            <div class="todo-detail-container" style="padding: var(--spacing-unit);">
                
                <h2 class="todo-title">${todo.title}</h2>
                <span class="prio-label">!</span>
                <!-- Accordeon for saving space -->
                <details class="mobile-accordion" style="border: 1px solid var(--border-color); padding: 0.5em; border-radius: 4px; margin-top: 1em;">
                    <summary style="cursor: pointer; font-weight: bold; color: var(--text-muted);">${labels.more}</summary>
                    
                    <div class="accordion-content" style="margin-top: 1em;">
                        <p><strong>${labels.priority}:</strong> ${Object.keys(TODO_PRIO).find(key => TODO_PRIO[key] === todo.prio)}</p>
                        <p><strong>${labels.notes}:</strong> ${todo.notes || "---"}</p>
                        
                        <div class="categories-list">
                            <strong>Kategorien:</strong>
                            ${todo.categories.map(cat => `<span class="cat-tag" style="background: var(--secondary-color); padding: 2px 6px; margin-right: 5px; border-radius: 3px; font-size: 0.85em;">${cat}</span>`).join('')}
                        </div>
                    </div>
                </details>
            </div>
            

            <!-- Disable Add-Button here -->
            <!-- <button class="main-add-btn">+</button> -->

        </main>

        <footer class="app-footer">
            <p>--- The Footer comes here ---</p>
        </footer>

        <script defer>
            const toggleContextMenu = (e) => {
                const targetMenu =  e.target.closest(".todo-item").querySelector(".todo-context-menu");
                if (!targetMenu) return 1;
                const openCtxMenus = document.querySelectorAll(".context-menu-visible");
                
                // console.log(openCtxMenus);
                // console.log(targetMenu);
                
                // close open context menus (if any)
                openCtxMenus.forEach(m => {
                    if (m !== targetMenu){
                        m.classList.remove("context-menu-visible");
                        m.classList.add("context-menu-hidden");
                    }
                });
                
                if (targetMenu.classList.contains("context-menu-hidden")) {
                    targetMenu.classList.remove("context-menu-hidden");
                    targetMenu.classList.add("context-menu-visible");
                } else {
                    targetMenu.classList.remove("context-menu-visible");
                    targetMenu.classList.add("context-menu-hidden");
                }
                
            }

            // activate event listeners for all todos to toggle their context menu
            const todos = document.querySelectorAll(".todo-item");
            todos.forEach(t => t.addEventListener("click", toggleContextMenu));

        </script>
     
    <!-- <script type="module" src="./js/App.js"></script> -->
</body>
</html>
